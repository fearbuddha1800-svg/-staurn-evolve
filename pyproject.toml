[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-hq"
version = "1.0.0"
description = "Quant HQ — Professional Trading Command Center"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Quant HQ"}]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.40"]
telegram = ["telethon>=1.34.0"]
ocr = ["Pillow>=10.0.0"]
quant = ["numpy>=1.24.0"]
dev = ["pytest>=7.0.0"]
all = [
    "MetaTrader5>=5.0.40",
    "telethon>=1.34.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
quant-hq = "hq:main"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "backups", "agent-reports"]

[tool.setuptools.package-data]
quant_hq = ["*.html", "*.css", "*.js", "*.json", "*.pine", "*.db"]
