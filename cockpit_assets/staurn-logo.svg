<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="STAURN logo">
  <defs>
    <linearGradient id="staurn-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#b5f268"/>
    </linearGradient>
    <filter id="staurn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Corner brackets framing -->
  <path d="M6 6h6v6" stroke="url(#staurn-gradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M52 6h-6v6" stroke="url(#staurn-gradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M6 52h6v-6" stroke="url(#staurn-gradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M52 52h-6v-6" stroke="url(#staurn-gradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Upward trending chart line forming STAURN -->
  <path d="M10 44 L22 30 L34 40 L46 20 L58 34" stroke="url(#staurn-gradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#staurn-glow)"/>
  <!-- STAURN monogram: S shape from the chart line, T bar -->
  <path d="M26 32h12" stroke="#00f0ff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="34" cy="32" r="2" fill="#ff00ff"/>
  <!-- Terminal cursor dot -->
  <circle cx="58" cy="34" r="2.5" fill="#b5f268"/>
</svg>
